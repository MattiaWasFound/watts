name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # libwatts is compiled ahead of time, which needs each OS's own toolchain, so it builds on a
  # runner of that OS and architecture.
  native:
    strategy:
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build libwatts
        shell: bash
        run: |
          dotnet publish dotnet/Watts.Native -c Release -r ${{ matrix.rid }} -o out
          mkdir -p pkg/libwatts-${{ matrix.rid }}/lib
          for f in out/libwatts.dylib out/libwatts.so out/libwatts.dll out/libwatts.lib; do
            if [ -f "$f" ]; then cp "$f" pkg/libwatts-${{ matrix.rid }}/lib/; fi
          done
          cp -R include examples LICENSE pkg/libwatts-${{ matrix.rid }}/
      - uses: actions/upload-artifact@v4
        with:
          name: libwatts-${{ matrix.rid }}
          path: pkg/

  release:
    needs: native
    # macOS, so the osx binaries get the ad-hoc signature Apple Silicon requires.
    runs-on: macos-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check versions match the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$v\"" unity/Watts/package.json
          grep -q "<Version>$v</Version>" dotnet/Watts.Core/Watts.Core.csproj
          grep -q "Version = \"$v\"" dotnet/Watts.Probe/Program.cs
          grep -q "Version = \"$v\"" dotnet/Watts.Cli/Program.cs
          grep -q "\"$v\\\\0\"" dotnet/Watts.Native/Exports.cs
      - name: Build
        run: bin/verify
      - name: Publish binaries
        run: |
          mkdir -p dist
          for rid in win-x64 win-arm64 osx-arm64 osx-x64 linux-x64 linux-arm64; do
            dotnet publish dotnet/Watts.Probe -c Release -r $rid -o out/probe-$rid
            dotnet publish dotnet/Watts.Cli -c Release -r $rid -o out/cli-$rid
            ext=""; case $rid in win-*) ext=".exe";; esac
            cp out/probe-$rid/Watts.Probe$ext dist/watts-probe-$rid$ext
            cp out/cli-$rid/Watts.Cli$ext dist/watts-$rid$ext
          done
          if otool -L dist/*-osx-* | grep homebrew; then echo "a binary links Homebrew"; exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          path: native
          merge-multiple: true
      - name: Archive libwatts
        run: |
          cd native
          for d in libwatts-*; do zip -qr "../dist/$d.zip" "$d"; done
      - name: Pack NuGet
        run: dotnet pack dotnet/Watts.Core -c Release -o dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md). Binaries are not signed: on Windows choose More info, Run anyway; on macOS run xattr -d com.apple.quarantine on the file."
      - name: NuGet
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push dist/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
